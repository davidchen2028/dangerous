<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>肢团建模预览 — Clump</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0a0a;
      color: #e8ddd0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
    }
    .ui h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .ui p.sub {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: rgba(210, 190, 170, 0.72);
      max-width: 28rem;
      line-height: 1.5;
    }
    .ref {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: min(28vw, 200px);
      border: 1px solid rgba(255, 200, 160, 0.25);
      border-radius: 6px;
      opacity: 0.88;
      pointer-events: none;
    }
    .ref img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .ref span {
      display: block;
      padding: 0.35rem 0.5rem;
      font-size: 0.65rem;
      color: rgba(180, 160, 140, 0.8);
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
    }
    .hint {
      font-size: 0.68rem;
      color: rgba(140, 120, 100, 0.7);
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="ref">
    <img src="./img/backrooms/clump/reference.png" alt="肢团参考" />
    <span>Wiki 参考</span>
  </div>
  <div class="ui">
    <div>
      <h1>肢团 · Clump</h1>
      <p class="sub">
        程序化建模：融合肉核 + 9 条肢体（5 腿支撑 / 4 臂外伸）· 蹲伏多足姿态 · 宽约 1.1m
      </p>
    </div>
    <p class="hint">拖拽旋转 · 滚轮缩放 · 肢体有轻微蠕动动画</p>
  </div>
  <script type="importmap">
  { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
  <script type="module">
  import * as THREE from "three";
  import { buildClumpFigure, CLUMP_BASE_WIDTH } from "./js/backrooms-clump.js";

  var canvas = document.getElementById("canvas");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14100e);
  scene.fog = new THREE.Fog(0x14100e, 3, 12);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 40);
  var orbitYaw = 0.55;
  var orbitPitch = 0.32;
  var orbitDist = 2.8;
  var dragId = null;
  var lastX = 0;
  var lastY = 0;

  function updateCamera() {
    var cp = Math.cos(orbitPitch);
    camera.position.set(
      Math.sin(orbitYaw) * cp * orbitDist,
      Math.sin(orbitPitch) * orbitDist + 0.15,
      Math.cos(orbitYaw) * cp * orbitDist
    );
    camera.lookAt(0, 0.22, 0);
  }
  updateCamera();

  canvas.addEventListener("pointerdown", function (e) {
    dragId = e.pointerId;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (dragId !== e.pointerId) return;
    orbitYaw -= (e.clientX - lastX) * 0.008;
    orbitPitch += (e.clientY - lastY) * 0.006;
    orbitPitch = Math.max(-0.15, Math.min(1.15, orbitPitch));
    lastX = e.clientX;
    lastY = e.clientY;
    updateCamera();
  });
  canvas.addEventListener("pointerup", function (e) {
    if (dragId !== e.pointerId) return;
    dragId = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener(
    "wheel",
    function (e) {
      e.preventDefault();
      orbitDist = Math.max(1.2, Math.min(6, orbitDist + e.deltaY * 0.002));
      updateCamera();
    },
    { passive: false }
  );

  scene.add(new THREE.AmbientLight(0xc8b8a8, 0.45));
  scene.add(new THREE.HemisphereLight(0xd8ccc0, 0x1a1410, 0.55));

  var key = new THREE.DirectionalLight(0xffe8d8, 0.95);
  key.position.set(2.5, 4, 2);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x664438, 0.35);
  fill.position.set(-2, 1.5, -1.5);
  scene.add(fill);

  var rim = new THREE.PointLight(0xff8855, 0.35, 6);
  rim.position.set(-1, 0.6, 1.2);
  scene.add(rim);

  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 8),
    new THREE.MeshStandardMaterial({
      color: 0x1a1614,
      roughness: 0.98,
      metalness: 0,
    })
  );
  floor.rotation.x = -Math.PI * 0.5;
  floor.position.y = 0;
  scene.add(floor);

  var grid = new THREE.GridHelper(6, 12, 0x3a3028, 0x221c18);
  scene.add(grid);

  var clump = buildClumpFigure({ scale: 1 });
  clump.group.rotation.y = 0.4;
  scene.add(clump.group);

  var widthRef = new THREE.Mesh(
    new THREE.BoxGeometry(CLUMP_BASE_WIDTH, 0.006, 0.006),
    new THREE.MeshBasicMaterial({ color: 0x55aa77, transparent: true, opacity: 0.5 })
  );
  widthRef.position.set(0, 0.01, CLUMP_BASE_WIDTH * 0.5);
  scene.add(widthRef);

  var clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    clump.update(clock.getElapsedTime());
    renderer.render(scene, camera);
  }
  frame();

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  });
  </script>
</body>
</html>
