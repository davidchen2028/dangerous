<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>后室 Level 119 — 水滑梯房</title>
  <link rel="stylesheet" href="css/backrooms-level0.css?v=22">
  <link rel="stylesheet" href="css/backrooms-survival.css?v=6">
  <style>
    /* 滑行时只压一层水雾暗角，管道本身要看得见 */
    .br-l119-slide {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      align-content: end;
      justify-items: center;
      padding-bottom: 12vh;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s linear;
      background:
        radial-gradient(ellipse at center, rgba(255, 255, 255, 0) 42%, rgba(12, 46, 78, 0.62) 100%),
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 12%),
        radial-gradient(circle at 74% 31%, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 9%),
        radial-gradient(circle at 58% 76%, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 10%);
    }
    .br-l119-slide.is-on { opacity: 1; }
    /* 向后掠过的高光条，补足速度感 */
    .br-l119-slide::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0 34px,
        rgba(255, 255, 255, 0.07) 34px 38px
      );
      mix-blend-mode: screen;
      animation: br-l119-rush 0.5s linear infinite;
    }
    @keyframes br-l119-rush {
      from { transform: translateY(0); }
      to { transform: translateY(38px); }
    }
    .br-l119-slide__text {
      position: relative;
      margin: 0;
      color: #eaf6ff;
      font: 600 clamp(16px, 3vw, 26px)/1.4 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 12px #000;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .br-l119-slide::after { animation: none; }
    }
  </style>
</head>
<body class="backrooms-level1 backrooms-level119">
  <canvas id="backroomsCanvas" aria-label="后室 Level 119"></canvas>
  <div id="backroomsInput" class="backrooms-input" aria-hidden="true"></div>
  <div class="backrooms-crosshair" id="backroomsCrosshair" aria-hidden="true"></div>
  <div class="backrooms-hud">
    <p class="backrooms-hud__title backrooms-hud__title--l1">Backrooms · Level 119 · 水滑梯房 · 生存难度 4</p>
    <div class="backrooms-nav"><div class="backrooms-nav__row">
      <p class="backrooms-temp" id="backroomsTemp"><span class="backrooms-temp__label">温度</span><span class="backrooms-temp__meter"><span class="backrooms-temp__fill" id="backroomsTempFill"></span></span><strong class="backrooms-temp__value" id="backroomsTempValue">—</strong></p>
      <p class="backrooms-points"><span class="backrooms-points__label">积分点</span><strong class="backrooms-points__value" id="backroomsMegPoints">0</strong></p>
    </div></div>
    <p class="backrooms-hud__hint" id="backroomsHint">加载中…</p>
    <p class="backrooms-hud__prompt" id="backroomsInteractHint" hidden></p>
    <p class="backrooms-hud__loot" id="backroomsLootToast" hidden></p>
    <div class="backrooms-hud__error" id="backroomsError" hidden></div>
  </div>
  <div class="br-l119-slide" id="backroomsL119Slide" aria-hidden="true">
    <p class="br-l119-slide__text" id="backroomsL119SlideText">滑行中…</p>
  </div>
  <script type="importmap">{"imports":{"three":"./js/vendor/three.module.min.js"}}</script>
  <script type="module" src="js/backrooms-level119.js?v=3"></script>
</body>
</html>
