<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>用户在线统计 · 极危行动</title>
  <style>
    :root {
      --bg: #0c1014;
      --panel: #141a22;
      --border: rgba(70, 90, 110, 0.35);
      --text: #c8d8e8;
      --muted: #6a8098;
      --accent: #8fd4a8;
      --warn: #e0a060;
      --danger: #e08070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem 1.5rem 2rem;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.75rem 1.5rem;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .meta strong { color: var(--accent); }
    .toolbar {
      max-width: 1200px;
      margin: 0 auto 0.75rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    button:hover { border-color: rgba(120, 160, 200, 0.55); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-kick {
      border-color: rgba(200, 140, 80, 0.45);
      color: var(--warn);
    }
    .btn-ban {
      border-color: rgba(200, 80, 70, 0.45);
      color: var(--danger);
    }
    .btn-unban {
      border-color: rgba(95, 214, 138, 0.35);
      color: var(--accent);
    }
    .btn-ban-ip {
      border-color: rgba(180, 120, 220, 0.45);
      color: #c8a8e8;
    }
    .btn-delete {
      border-color: rgba(200, 60, 50, 0.55);
      color: #f0a090;
    }
    .btn-restock {
      border-color: rgba(95, 214, 138, 0.35);
      color: var(--accent);
    }
    .market-toolbar {
      align-items: center;
    }
    .market-toolbar .meta {
      margin-right: 0.25rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(360px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    .modal h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }
    .modal p {
      margin: 0 0 0.75rem;
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .modal label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .modal input {
      width: 100%;
      padding: 0.45rem 0.6rem;
      font-size: 0.875rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: rgba(8, 12, 18, 0.9);
      color: var(--text);
      margin-bottom: 0.85rem;
    }
    .modal__actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    .ip-list {
      max-width: 1200px;
      margin: 0.75rem auto 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .ip-list ul {
      margin: 0.35rem 0 0;
      padding-left: 1.2rem;
    }
    .panel {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    th, td {
      padding: 0.5rem 0.65rem;
      text-align: left;
      border-bottom: 1px solid rgba(50, 65, 80, 0.35);
      vertical-align: middle;
    }
    th {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
    }
    tr:hover td { background: rgba(40, 55, 70, 0.25); }
    .num { font-variant-numeric: tabular-nums; }
    .online-badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.68rem;
    }
    .online-badge--on {
      background: rgba(95, 214, 138, 0.15);
      color: var(--accent);
    }
    .online-badge--off {
      background: rgba(80, 90, 100, 0.2);
      color: var(--muted);
    }
    .nick-cell {
      white-space: nowrap;
    }
    .nick-cell__name {
      vertical-align: middle;
    }
    .device-mark {
      display: inline-block;
      width: 0.55rem;
      height: 0.55rem;
      margin-left: 0.35rem;
      border: 2px solid #6ab4e8;
      border-radius: 1px;
      vertical-align: middle;
      box-shadow: 0 0 6px rgba(90, 170, 230, 0.35);
    }
    .ban-badge {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.65rem;
      color: var(--danger);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .toast {
      max-width: 1200px;
      margin: 0 auto 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      display: none;
    }
    .toast--ok {
      display: block;
      background: rgba(95, 214, 138, 0.12);
      border: 1px solid rgba(95, 214, 138, 0.35);
      color: var(--accent);
    }
    .toast--err {
      display: block;
      background: rgba(180, 60, 50, 0.12);
      border: 1px solid rgba(200, 80, 70, 0.4);
      color: #e8a090;
    }
    .error, .loading {
      max-width: 1200px;
      margin: 1rem auto;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    .loading { color: var(--muted); }
    .error {
      background: rgba(180, 60, 50, 0.15);
      border: 1px solid rgba(200, 80, 70, 0.4);
      color: #e8a090;
    }
    .foot {
      max-width: 1200px;
      margin: 0.75rem auto 0;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>用户在线时长</h1>
    <p class="meta" id="summary">加载中…</p>
  </header>
  <div class="toolbar">
    <button type="button" id="btnRefresh">立即刷新</button>
    <a id="megGovernanceLink" href="#" style="color:var(--accent);font-size:0.8rem;align-self:center;">M.E.G. 治理台</a>
    <label class="meta" style="display:flex;align-items:center;gap:0.35rem;">
      <input type="checkbox" id="autoRefresh" checked> 每 10 秒自动刷新
    </label>
  </div>
  <div class="toolbar market-toolbar">
    <span class="meta" id="marketStockSummary">黑市库存：加载中…</span>
    <button type="button" class="btn-restock" data-restock="5">全品类补货 +5</button>
    <button type="button" class="btn-restock" data-restock="10">全品类补货 +10</button>
    <button type="button" class="btn-restock" data-restock="20">全品类补货 +20</button>
    <button type="button" class="btn-restock" data-reset-stock="1">重置货源为 5</button>
  </div>
  <p class="toast" id="toast" hidden></p>
  <p class="loading" id="status">正在拉取数据…</p>
  <div class="panel" id="tableWrap" hidden>
    <table>
      <thead>
        <tr>
          <th>昵称</th>
          <th>状态</th>
          <th>最近 IP</th>
          <th>累计在线</th>
          <th>登录次数</th>
          <th>最后活跃</th>
          <th>注册时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="ip-list" id="bannedIpBox" hidden>
    <strong>已封禁 IP</strong>
    <ul id="bannedIpList"></ul>
  </div>
  <p class="foot">账号封禁 / IP 封禁互不影响。注销账号不可恢复，需再次输入管理员密码。请勿分享带密钥的链接。</p>

  <div class="modal-backdrop" id="deleteModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="deleteModalTitle">
      <h2 id="deleteModalTitle">注销账号</h2>
      <p id="deleteModalDesc">将永久删除该账号及好友、会话、在线记录，无法恢复。</p>
      <label for="deleteAdminPassword">管理员密码</label>
      <input type="password" id="deleteAdminPassword" autocomplete="current-password" placeholder="输入 JIWEI_ADMIN_KEY">
      <div class="modal__actions">
        <button type="button" id="deleteModalCancel">取消</button>
        <button type="button" class="btn-delete" id="deleteModalConfirm">确认注销</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var key = params.get("key") || "";
      document.getElementById("megGovernanceLink").href =
        "/admin/meg-governance?key=" + encodeURIComponent(key);
      var summaryEl = document.getElementById("summary");
      var statusEl = document.getElementById("status");
      var toastEl = document.getElementById("toast");
      var tbody = document.getElementById("tbody");
      var tableWrap = document.getElementById("tableWrap");
      var timer = null;
      var actionBusy = false;
      var pendingDelete = null;
      var deleteModal = document.getElementById("deleteModal");
      var deleteAdminPassword = document.getElementById("deleteAdminPassword");
      var deleteModalDesc = document.getElementById("deleteModalDesc");

      function formatDuration(seconds) {
        seconds = Math.max(0, Math.floor(seconds || 0));
        if (seconds < 60) return seconds + " 秒";
        var m = Math.floor(seconds / 60);
        if (m < 60) return m + " 分 " + (seconds % 60) + " 秒";
        var h = Math.floor(m / 60);
        m = m % 60;
        if (h < 24) return h + " 小时 " + m + " 分";
        var d = Math.floor(h / 24);
        h = h % 24;
        return d + " 天 " + h + " 小时 " + m + " 分";
      }

      function formatTime(iso) {
        if (!iso) return "—";
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return iso;
          return d.toLocaleString("zh-CN", { hour12: false });
        } catch (e) {
          return iso;
        }
      }

      function escapeHtml(s) {
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      function showToast(text, isError) {
        toastEl.hidden = false;
        toastEl.textContent = text;
        toastEl.className = "toast " + (isError ? "toast--err" : "toast--ok");
        setTimeout(function () {
          toastEl.hidden = true;
        }, 4000);
      }

      function parseJsonResponse(r) {
        var ct = (r.headers.get("content-type") || "").toLowerCase();
        if (ct.indexOf("application/json") === -1) {
          return r.text().then(function (body) {
            var hint =
              "服务器返回了网页而不是 JSON（常见于未用 ./run.sh 启动，或服务器未重启到最新版）。";
            if (body && body.indexOf("<!") === 0) {
              throw new Error(hint);
            }
            throw new Error(hint + " HTTP " + r.status);
          });
        }
        return r.json();
      }

      function adminPost(path, body) {
        if (actionBusy) return Promise.reject(new Error("请稍候…"));
        actionBusy = true;
        return fetch(path + "?key=" + encodeURIComponent(key), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        })
          .then(function (r) {
            return parseJsonResponse(r).then(function (data) {
              if (!r.ok) {
                throw new Error(
                  (data && (data.message || data.error)) || "HTTP " + r.status
                );
              }
              return data;
            });
          })
          .finally(function () {
            actionBusy = false;
          });
      }

      function openDeleteModal(userId, nickname) {
        pendingDelete = { userId: userId, nickname: nickname };
        deleteModalDesc.textContent =
          "确定永久注销「" + nickname + "」？将删除账号、好友、会话与在线记录，无法恢复。";
        deleteAdminPassword.value = "";
        deleteModal.hidden = false;
        deleteAdminPassword.focus();
      }

      function closeDeleteModal() {
        pendingDelete = null;
        deleteModal.hidden = true;
        deleteAdminPassword.value = "";
      }

      function confirmDeleteUser() {
        if (!pendingDelete) return;
        var adminPassword = deleteAdminPassword.value;
        if (!adminPassword) {
          showToast("请输入管理员密码", true);
          deleteAdminPassword.focus();
          return;
        }
        var userId = pendingDelete.userId;
        var nickname = pendingDelete.nickname;
        adminPost("/api/admin/delete-user", {
          userId: userId,
          adminPassword: adminPassword,
        })
          .then(function (res) {
            closeDeleteModal();
            showToast(res.message || "已注销", false);
            load(true);
          })
          .catch(function (err) {
            showToast(err.message || "注销失败", true);
          });
      }

      function onActionClick(e) {
        var btn = e.target.closest("button[data-action]");
        if (!btn || btn.disabled) return;
        var action = btn.getAttribute("data-action");

        if (action === "unban-ip") {
          var ipOnly = btn.getAttribute("data-ip") || "";
          if (!ipOnly) {
            showToast("缺少 IP 地址", true);
            return;
          }
          if (!confirm("确定解封 IP「" + ipOnly + "」？")) return;
          adminPost("/api/admin/unban-ip", { ip: ipOnly })
            .then(function (res) {
              showToast(res.message || "已解封 IP", false);
              load(true);
            })
            .catch(function (err) {
              showToast(err.message || "解封 IP 失败", true);
            });
          return;
        }

        var userId = parseInt(btn.getAttribute("data-user-id"), 10);
        var nickname = btn.getAttribute("data-nickname") || "";
        if (!userId) return;

        if (action === "kick") {
          if (!confirm("确定踢下线「" + nickname + "」？")) return;
          adminPost("/api/admin/kick", { userId: userId })
            .then(function (res) {
              showToast(res.message || "已踢下线", false);
              load(true);
            })
            .catch(function (err) {
              showToast(err.message || "踢下线失败", true);
            });
          return;
        }

        if (action === "ban") {
          var days = parseInt(btn.getAttribute("data-days"), 10) || 1;
          if (!confirm("确定封禁账号「" + nickname + "」" + days + " 天？")) return;
          adminPost("/api/admin/ban", { userId: userId, days: days })
            .then(function (res) {
              showToast(res.message || "已封禁", false);
              load(true);
            })
            .catch(function (err) {
              showToast(err.message || "封禁失败", true);
            });
          return;
        }

        if (action === "ban-ip") {
          var ipDays = parseInt(btn.getAttribute("data-days"), 10) || 1;
          var ipAddr = btn.getAttribute("data-ip") || "";
          if (!ipAddr) {
            showToast("该用户尚无登录 IP 记录", true);
            return;
          }
          if (!confirm("确定封禁 IP「" + ipAddr + "」" + ipDays + " 天？\n同 IP 下所有账号将无法连接。")) return;
          adminPost("/api/admin/ban-ip", { userId: userId, days: ipDays })
            .then(function (res) {
              showToast(res.message || "已封禁 IP", false);
              load(true);
            })
            .catch(function (err) {
              showToast(err.message || "封禁 IP 失败", true);
            });
          return;
        }

        if (action === "unban") {
          if (!confirm("确定解封账号「" + nickname + "」？")) return;
          adminPost("/api/admin/unban", { userId: userId })
            .then(function (res) {
              showToast(res.message || "已解封", false);
              load(true);
            })
            .catch(function (err) {
              showToast(err.message || "解封失败", true);
            });
          return;
        }

        if (action === "delete-user") {
          openDeleteModal(userId, nickname);
        }
      }

      function renderBannedIps(list) {
        var box = document.getElementById("bannedIpBox");
        var ul = document.getElementById("bannedIpList");
        if (!list || !list.length) {
          box.hidden = true;
          return;
        }
        box.hidden = false;
        ul.innerHTML = "";
        list.forEach(function (item) {
          var li = document.createElement("li");
          li.innerHTML =
            escapeHtml(item.ip) +
            " — 至 " +
            escapeHtml(formatTime(item.bannedUntil)) +
            ' <button type="button" class="btn-unban" data-action="unban-ip" data-ip="' +
            escapeHtml(item.ip) +
            '">解封</button>';
          ul.appendChild(li);
        });
      }

      function load(soft) {
        if (!key) {
          statusEl.className = "error";
          statusEl.textContent = "缺少 URL 参数 key=你的管理密钥";
          return;
        }
        if (!soft) {
          statusEl.className = "loading";
          statusEl.hidden = false;
          statusEl.textContent = "正在拉取数据…";
        }
        fetch("/api/admin/user-online-stats?key=" + encodeURIComponent(key))
          .then(function (r) {
            return parseJsonResponse(r).then(function (data) {
              if (!r.ok) {
                throw new Error(
                  r.status === 403
                    ? "密钥错误或管理页未启用（需设置 JIWEI_ADMIN_KEY 并重启 ./run.sh）"
                    : (data && (data.message || data.error)) || "HTTP " + r.status
                );
              }
              return data;
            });
          })
          .then(render)
          .catch(function (err) {
            if (!soft) {
              tableWrap.hidden = true;
            }
            statusEl.hidden = false;
            statusEl.className = "error";
            var msg = err.message || "加载失败";
            if (
              msg === "Failed to fetch" ||
              msg.indexOf("NetworkError") >= 0 ||
              msg.indexOf("Load failed") >= 0
            ) {
              msg =
                "无法连接服务器。请先在本机终端运行 ./run.sh（或 ./run-admin.sh），" +
                "再用 http://127.0.0.1:8080 或 :8082 打开本页，不要双击 html 文件。";
            }
            statusEl.textContent = msg;
          });
      }

      function renderNicknameCell(u) {
        var html =
          '<span class="nick-cell__name">' + escapeHtml(u.nickname) + "</span>";
        if (u.clientDevice === "mobile" || u.clientDevice === "tablet") {
          html +=
            '<span class="device-mark" title="' +
            (u.clientDevice === "tablet" ? "iPad / 平板" : "手机") +
            '"></span>';
        }
        return html;
      }

      function renderMarketStockSummary(marketStock) {
        var el = document.getElementById("marketStockSummary");
        if (!el) return;
        if (!marketStock) {
          el.textContent = "黑市库存：—";
          return;
        }
        el.textContent =
          "黑市库存：共 " +
          (marketStock.productCount || 0) +
          " 种 · 总现货 " +
          (marketStock.totalUnits || 0) +
          " · 已售罄 " +
          (marketStock.soldOutCount || 0) +
          " 种";
      }

      function onRestockClick(e) {
        var btn = e.target.closest("button[data-restock], button[data-reset-stock]");
        if (!btn || btn.disabled) return;
        if (btn.hasAttribute("data-reset-stock")) {
          if (!confirm("确定将全品类黑市货源重置为 5？")) return;
          adminPost("/api/admin/market-reset-stock", {})
            .then(function (res) {
              showToast(res.message || "已重置货源", false);
              if (res.marketStock) {
                renderMarketStockSummary(res.marketStock);
              }
              load(true);
            })
            .catch(function (err) {
              showToast(err.message || "重置失败", true);
            });
          return;
        }
        var amount = parseInt(btn.getAttribute("data-restock"), 10);
        if (!amount) return;
        if (!confirm("确定为全品类黑市补货 +" + amount + "？")) return;
        adminPost("/api/admin/market-restock", { amount: amount })
          .then(function (res) {
            showToast(res.message || "补货成功", false);
            if (res.marketStock) {
              renderMarketStockSummary(res.marketStock);
            }
            load(true);
          })
          .catch(function (err) {
            showToast(err.message || "补货失败", true);
          });
      }

      function render(data) {
        statusEl.hidden = true;
        tableWrap.hidden = false;
        renderMarketStockSummary(data.marketStock);
        summaryEl.innerHTML =
          "共 <strong>" + data.userCount + "</strong> 个用户 · " +
          "当前在线 <strong>" + data.onlineCount + "</strong> · " +
          "更新于 " + formatTime(data.generatedAt);
        renderBannedIps(data.bannedIps || []);
        tbody.innerHTML = "";
        (data.users || []).forEach(function (u) {
          var tr = document.createElement("tr");
          var statusHtml =
            '<span class="online-badge online-badge--' +
            (u.online ? "on" : "off") + '">' +
            (u.online ? "在线" : "离线") + "</span>";
          if (u.banned) {
            statusHtml +=
              '<span class="ban-badge">账号封禁至 ' +
              escapeHtml(formatTime(u.bannedUntil)) +
              "</span>";
          }
          if (u.ipBanned) {
            statusHtml +=
              '<span class="ban-badge">IP 封禁至 ' +
              escapeHtml(formatTime(u.ipBannedUntil)) +
              "</span>";
          }
          var hasIp = !!(u.lastIp && u.lastIp.length);
          var actionsHtml =
            '<div class="actions">' +
            '<button type="button" class="btn-kick" data-action="kick" data-user-id="' +
            u.userId +
            '" data-nickname="' +
            escapeHtml(u.nickname) +
            '"' +
            (u.online ? "" : " disabled") +
            ">踢下线</button>" +
            '<button type="button" class="btn-ban" data-action="ban" data-days="1" data-user-id="' +
            u.userId +
            '" data-nickname="' +
            escapeHtml(u.nickname) +
            '"' +
            (u.banned ? " disabled" : "") +
            ">封禁1天</button>" +
            '<button type="button" class="btn-ban" data-action="ban" data-days="5" data-user-id="' +
            u.userId +
            '" data-nickname="' +
            escapeHtml(u.nickname) +
            '"' +
            (u.banned ? " disabled" : "") +
            ">封禁5天</button>" +
            '<button type="button" class="btn-ban-ip" data-action="ban-ip" data-days="1" data-user-id="' +
            u.userId +
            '" data-ip="' +
            escapeHtml(u.lastIp || "") +
            '" data-nickname="' +
            escapeHtml(u.nickname) +
            '"' +
            (!hasIp || u.ipBanned ? " disabled" : "") +
            ">封IP1天</button>" +
            '<button type="button" class="btn-ban-ip" data-action="ban-ip" data-days="5" data-user-id="' +
            u.userId +
            '" data-ip="' +
            escapeHtml(u.lastIp || "") +
            '" data-nickname="' +
            escapeHtml(u.nickname) +
            '"' +
            (!hasIp || u.ipBanned ? " disabled" : "") +
            ">封IP5天</button>";
          if (u.banned) {
            actionsHtml +=
              '<button type="button" class="btn-unban" data-action="unban" data-user-id="' +
              u.userId +
              '" data-nickname="' +
              escapeHtml(u.nickname) +
              '">解封账号</button>';
          }
          if (u.ipBanned && u.lastIp) {
            actionsHtml +=
              '<button type="button" class="btn-unban" data-action="unban-ip" data-user-id="' +
              u.userId +
              '" data-ip="' +
              escapeHtml(u.lastIp) +
              '">解封IP</button>';
          }
          actionsHtml +=
            '<button type="button" class="btn-delete" data-action="delete-user" data-user-id="' +
            u.userId +
            '" data-nickname="' +
            escapeHtml(u.nickname) +
            '">注销</button>';
          actionsHtml += "</div>";

          tr.innerHTML =
            '<td class="nick-cell">' + renderNicknameCell(u) + "</td>" +
            "<td>" + statusHtml + "</td>" +
            "<td>" + (hasIp ? escapeHtml(u.lastIp) : "—") + "</td>" +
            '<td class="num">' + formatDuration(u.totalOnlineSeconds) + "</td>" +
            '<td class="num">' + (u.sessionCount || 0) + "</td>" +
            "<td>" + formatTime(u.lastSeenAt) + "</td>" +
            "<td>" + formatTime(u.registeredAt) + "</td>" +
            "<td>" + actionsHtml + "</td>";
          tbody.appendChild(tr);
        });
      }

      tbody.addEventListener("click", onActionClick);
      document.getElementById("bannedIpBox").addEventListener("click", onActionClick);
      document.querySelector(".market-toolbar").addEventListener("click", onRestockClick);
      document.getElementById("deleteModalCancel").addEventListener("click", closeDeleteModal);
      document.getElementById("deleteModalConfirm").addEventListener("click", confirmDeleteUser);
      deleteModal.addEventListener("click", function (e) {
        if (e.target === deleteModal) closeDeleteModal();
      });
      deleteAdminPassword.addEventListener("keydown", function (e) {
        if (e.key === "Enter") confirmDeleteUser();
        if (e.key === "Escape") closeDeleteModal();
      });
      var AUTO_REFRESH_MS = 10000;

      document.getElementById("btnRefresh").addEventListener("click", load);
      document.getElementById("autoRefresh").addEventListener("change", function (e) {
        if (timer) clearInterval(timer);
        timer = null;
        if (e.target.checked) timer = setInterval(load, AUTO_REFRESH_MS);
      });

      load();
      timer = setInterval(load, AUTO_REFRESH_MS);
    })();
  </script>
</body>
</html>
