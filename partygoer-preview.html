<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>派对客建模预览 — Partygoer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1610;
      color: #f0e8d0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
    }
    .ui h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .ui p.sub {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: rgba(230, 210, 170, 0.75);
      max-width: 30rem;
      line-height: 1.5;
    }
    .ref {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: min(28vw, 200px);
      border: 1px solid rgba(255, 220, 120, 0.3);
      border-radius: 6px;
      opacity: 0.9;
      pointer-events: none;
    }
    .ref img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .ref span {
      display: block;
      padding: 0.35rem 0.5rem;
      font-size: 0.65rem;
      color: rgba(200, 180, 140, 0.85);
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
    }
    .hint {
      font-size: 0.68rem;
      color: rgba(160, 140, 100, 0.75);
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="ref">
    <img src="./img/backrooms/partygoer/reference.png" alt="派对客参考" />
    <span>Wiki 参考</span>
  </div>
  <div class="ui">
    <div>
      <h1>派对客 · Partygoer</h1>
      <p class="sub">
        程序化建模：钟形黄身 + 笑脸柱头 + 细臂 + 红气球 · 高约 2.15m · 轻微摇摆动画
      </p>
    </div>
    <p class="hint">拖拽旋转 · 滚轮缩放</p>
  </div>
  <script type="importmap">
  { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
  <script type="module">
  import * as THREE from "three";
  import { buildPartygoerFigure, PARTYGOER_HEIGHT } from "./js/backrooms-partygoer.js";

  var canvas = document.getElementById("canvas");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicMapping;
  renderer.toneMappingExposure = 1.05;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2418);
  scene.fog = new THREE.Fog(0x2a2418, 4, 14);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 40);
  var orbitYaw = 0.35;
  var orbitPitch = 0.22;
  var orbitDist = 3.6;
  var dragId = null;
  var lastX = 0;
  var lastY = 0;

  function updateCamera() {
    var cp = Math.cos(orbitPitch);
    camera.position.set(
      Math.sin(orbitYaw) * cp * orbitDist,
      Math.sin(orbitPitch) * orbitDist + 0.95,
      Math.cos(orbitYaw) * cp * orbitDist
    );
    camera.lookAt(0, 1.05, 0);
  }
  updateCamera();

  canvas.addEventListener("pointerdown", function (e) {
    dragId = e.pointerId;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (dragId !== e.pointerId) return;
    orbitYaw -= (e.clientX - lastX) * 0.008;
    orbitPitch += (e.clientY - lastY) * 0.006;
    orbitPitch = Math.max(-0.1, Math.min(1.0, orbitPitch));
    lastX = e.clientX;
    lastY = e.clientY;
    updateCamera();
  });
  canvas.addEventListener("pointerup", function (e) {
    if (dragId !== e.pointerId) return;
    dragId = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener(
    "wheel",
    function (e) {
      e.preventDefault();
      orbitDist = Math.max(1.8, Math.min(8, orbitDist + e.deltaY * 0.002));
      updateCamera();
    },
    { passive: false }
  );

  scene.add(new THREE.AmbientLight(0xfff0d0, 0.5));
  scene.add(new THREE.HemisphereLight(0xffe8b0, 0x1a1410, 0.55));

  var key = new THREE.DirectionalLight(0xfff5dd, 1.0);
  key.position.set(2, 5, 3);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x886644, 0.35);
  fill.position.set(-2.5, 2, -1.5);
  scene.add(fill);

  var rim = new THREE.PointLight(0xff6644, 0.4, 8);
  rim.position.set(1.5, 2, -1);
  scene.add(rim);

  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 8),
    new THREE.MeshStandardMaterial({
      color: 0x3a3028,
      roughness: 0.95,
    })
  );
  floor.rotation.x = -Math.PI * 0.5;
  scene.add(floor);

  var rug = new THREE.Mesh(
    new THREE.PlaneGeometry(2.8, 2.2),
    new THREE.MeshStandardMaterial({
      color: 0x4a6838,
      roughness: 0.98,
      emissive: 0x102008,
      emissiveIntensity: 0.15,
    })
  );
  rug.rotation.x = -Math.PI * 0.5;
  rug.position.set(0, 0.01, 0.3);
  scene.add(rug);

  var grid = new THREE.GridHelper(6, 12, 0x4a4030, 0x2a2418);
  scene.add(grid);

  var partygoer = buildPartygoerFigure({ scale: 1, seed: 3 });
  partygoer.group.rotation.y = 0.15;
  scene.add(partygoer.group);

  var heightRef = new THREE.Mesh(
    new THREE.BoxGeometry(0.006, PARTYGOER_HEIGHT, 0.006),
    new THREE.MeshBasicMaterial({ color: 0x55aa77, transparent: true, opacity: 0.5 })
  );
  heightRef.position.set(-0.65, PARTYGOER_HEIGHT * 0.5, 0);
  scene.add(heightRef);

  var clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    partygoer.update(clock.getElapsedTime());
    renderer.render(scene, camera);
  }
  frame();

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  });
  </script>
</body>
</html>
