<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>后室 Level 3 — 发电站</title>
  <link rel="stylesheet" href="css/backrooms-level0.css?v=26">
  <link rel="stylesheet" href="css/backrooms-survival.css?v=6">
  <style>
    .backrooms-l3-warning {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      padding: 0 12px;
      max-width: 92vw;
      text-align: center;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: 0.06em;
      color: rgba(228, 224, 210, 0.62);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      pointer-events: none;
      user-select: none;
      z-index: 40;
    }
    @media (max-width: 560px) {
      .backrooms-l3-warning {
        font-size: 10px;
        white-space: normal;
      }
    }
  </style>
</head>
<body class="backrooms-level1 backrooms-level2">
  <canvas id="backroomsCanvas" aria-label="后室 Level 3"></canvas>
  <div id="backroomsInput" class="backrooms-input" aria-hidden="true"></div>
  <div class="backrooms-crosshair" id="backroomsCrosshair" aria-hidden="true"></div>
  <p class="backrooms-l3-warning" aria-hidden="true">不要试图去破坏这里，不要试图去滥用后室的资源，否则……</p>
  <div class="backrooms-hud">
    <p class="backrooms-hud__title backrooms-hud__title--l1">Backrooms · Level 3 · 发电站 · 生存难度 4</p>
    <div class="backrooms-nav" aria-label="状态">
      <div class="backrooms-nav__row">
        <p class="backrooms-temp" id="backroomsTemp">
          <span class="backrooms-temp__label">温度</span>
          <span class="backrooms-temp__meter" aria-hidden="true"
            ><span class="backrooms-temp__fill" id="backroomsTempFill"></span
          ></span>
          <strong class="backrooms-temp__value" id="backroomsTempValue">—</strong>
        </p>
        <p class="backrooms-points">
          <span class="backrooms-points__label">积分点</span>
          <strong class="backrooms-points__value" id="backroomsMegPoints">0</strong>
        </p>
      </div>
    </div>
    <p class="backrooms-hud__hint" id="backroomsHint">加载中…</p>
    <p class="backrooms-hud__prompt" id="backroomsElevatorHint" hidden>
      按 <kbd>Q</kbd> 或点击画面乘电梯
    </p>
    <p class="backrooms-hud__loot" id="backroomsLootToast" hidden></p>
    <div class="backrooms-hud__error" id="backroomsError" hidden></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="js/backrooms-level3.js?v=27"></script>
</body>
</html>
