<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>后室 alpha</title>
  <link rel="stylesheet" href="css/backrooms-level0.css?v=17">
  <link rel="stylesheet" href="css/backrooms-survival.css?v=3">
</head>
<body class="backrooms-level1">
  <canvas id="backroomsCanvas" aria-label="后室 alpha"></canvas>
  <div id="backroomsInput" class="backrooms-input" aria-hidden="true"></div>
  <div class="backrooms-crosshair" id="backroomsCrosshair" aria-hidden="true"></div>

  <div class="backrooms-hud">
    <p class="backrooms-hud__title backrooms-hud__title--l1">Backrooms · alpha</p>
    <div class="backrooms-nav" aria-label="状态">
      <div class="backrooms-nav__row">
        <p class="backrooms-overheat" id="backroomsOverheat" hidden>过热</p>
        <p class="backrooms-temp" id="backroomsTemp">
          <span class="backrooms-temp__label">温度</span>
          <span class="backrooms-temp__meter" aria-hidden="true"
            ><span class="backrooms-temp__fill" id="backroomsTempFill"></span
          ></span>
          <strong class="backrooms-temp__value" id="backroomsTempValue">—</strong>
        </p>
        <p class="backrooms-points">
          <span class="backrooms-points__label">积分点</span>
          <strong class="backrooms-points__value" id="backroomsMegPoints">0</strong>
        </p>
      </div>
    </div>
    <p class="backrooms-hud__hint" id="backroomsHint">加载中…</p>
    <p class="backrooms-hud__search" id="backroomsSearchHint" hidden>按 <kbd>F</kbd> 搜索宝箱</p>
    <p class="backrooms-hud__talk" id="backroomsTalkHint" hidden>按 <kbd>Q</kbd> 与 M.E.G 人员对话</p>
    <p class="backrooms-hud__talk backrooms-hud__talk--door" id="backroomsDoorHint" hidden>按 <kbd>Q</kbd> 打开基地门</p>
    <p class="backrooms-hud__talk backrooms-hud__talk--interior" id="backroomsInteriorTalkHint" hidden>按 <kbd>Q</kbd> 与 M.E.G 工作人员对话</p>
    <p class="backrooms-hud__talk backrooms-hud__talk--interior" id="backroomsLevel11Hint" hidden>按 <kbd>Q</kbd> 与 M.E.G 人员对话</p>
    <p class="backrooms-hud__clip" id="backroomsBlackoutHint" hidden>暴盲 — 灯光熄灭，摸索寻找宝箱…</p>
    <p class="backrooms-hud__loot" id="backroomsLootToast" hidden></p>
    <div class="backrooms-dialogue" id="backroomsDialogue" hidden role="dialog" aria-label="对话">
      <p class="backrooms-dialogue__speaker" id="backroomsDialogueSpeaker">M.E.G 人员</p>
      <p class="backrooms-dialogue__text" id="backroomsDialogueText"></p>
      <img class="backrooms-dialogue__image" id="backroomsDialogueImage" hidden alt="" />
      <p class="backrooms-dialogue__choices" id="backroomsDialogueChoices" hidden></p>
    </div>
    <div class="backrooms-hud__error" id="backroomsError" hidden></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="js/backrooms-level1.js?v=57"></script>
</body>
</html>
