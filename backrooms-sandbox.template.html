<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Backrooms - 沙盒</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8fc8e8}
    button,select,input{font:inherit}
    #world{display:block;width:100%;height:100%;touch-action:none;outline:0}
    .hud{position:fixed;inset:0;pointer-events:none}
    .brand{position:absolute;left:18px;top:16px;padding:10px 14px;border:1px solid #ffffff55;border-radius:14px;background:#163044bb;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0004}
    .brand strong{display:block;font-size:16px;letter-spacing:.08em}
    .brand span{display:block;margin-top:4px;color:#d8edf7;font-size:12px}
    #modeButton{position:absolute;right:18px;top:16px;pointer-events:auto;border:1px solid #fff7;border-radius:999px;padding:10px 16px;color:#fff;background:#294e68dd;cursor:pointer}
    #crosshair{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%)}
    #crosshair::before,#crosshair::after{content:"";position:absolute;background:#fff;box-shadow:0 1px 2px #000}
    #crosshair::before{left:4px;top:0;width:2px;height:10px}
    #crosshair::after{left:0;top:4px;width:10px;height:2px}
    .help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:#122230c9;color:#eaf8ff;font-size:12px;white-space:nowrap}
    #editorPanel{position:absolute;right:18px;top:72px;width:min(310px,calc(100vw - 36px));padding:15px;pointer-events:auto;border:1px solid #fff5;border-radius:16px;background:#152936e8;box-shadow:0 15px 50px #0007;backdrop-filter:blur(10px)}
    #editorPanel[hidden]{display:none}
    #editorPanel h2{margin:0 0 12px;font-size:16px}
    .field{display:grid;grid-template-columns:88px 1fr 36px;gap:8px;align-items:center;margin:9px 0;font-size:13px}
    .field select,.field input{width:100%}
    select{grid-column:2/4;padding:7px 9px;border:1px solid #ffffff44;border-radius:8px;color:#fff;background:#263e4d}
    input[type=range]{accent-color:#ffd066}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .actions button{padding:9px 7px;border:1px solid #ffffff44;border-radius:9px;color:#fff;background:#2d5368;cursor:pointer}
    .actions button.primary{grid-column:1/-1;background:#ad6b24;border-color:#ffd28b}
    #importFile{display:none}
    #toast{position:absolute;left:50%;top:82px;transform:translate(-50%,-12px);padding:10px 16px;border-radius:10px;background:#10202bdc;color:#fff;opacity:0;transition:.25s;box-shadow:0 8px 28px #0005}
    #toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:680px){.help{white-space:normal;text-align:center;width:calc(100% - 32px)}#editorPanel{top:68px}.brand{max-width:60vw}}
  </style>
</head>
<body>
  <canvas id="world" aria-label="Backrooms 沙盒开放世界"></canvas>
  <div class="hud">
    <div class="brand"><strong>BACKROOMS - 沙盒</strong><span id="modeText">游戏模式</span></div>
    <button id="modeButton" type="button">进入编辑器</button>
    <div id="crosshair" aria-hidden="true"></div>
    <div class="help" id="helpText">WASD 移动 · Shift 奔跑 · Space 跳跃 · 点击锁定鼠标 · Esc 释放</div>
    <section id="editorPanel" hidden>
      <h2>Chunk 地图编辑器</h2>
      <label class="field"><span>工具</span><select id="tool">
        <option value="raise">抬高地形</option><option value="lower">降低地形</option>
        <option value="flatten">平整地形</option><option value="place">放置物体</option>
        <option value="delete">删除物体</option>
      </select></label>
      <label class="field"><span>物体</span><select id="objectKind">
        <option value="tree">树木</option><option value="rock">岩石</option>
        <option value="crate">木箱</option><option value="ruin">遗迹</option>
      </select></label>
      <label class="field"><span>笔刷大小</span><input id="brushSize" type="range" min="2" max="18" step=".5" value="5"><b id="sizeValue">5.0</b></label>
      <label class="field"><span>笔刷强度</span><input id="brushStrength" type="range" min=".2" max="5" step=".2" value="1.4"><b id="strengthValue">1.4</b></label>
      <div class="actions">
        <button id="exportJson" type="button">导出 JSON</button>
        <button id="importJson" type="button">导入 JSON</button>
        <button id="copyCode" class="primary" type="button">复制地图到代码</button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json">
    </section>
    <div id="toast" role="status"></div>
  </div>
  <script>/*__BACKROOMS_SANDBOX_BUNDLE__*/</script>
</body>
</html>
