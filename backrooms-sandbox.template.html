<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Backrooms - 沙盒</title>
  <link rel="stylesheet" href="css/backrooms-survival.css">
  <style>
    :root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8fc8e8}
    button,select,input{font:inherit}
    #world{display:block;width:100%;height:100%;touch-action:none;outline:0}
    .hud{position:fixed;inset:0;pointer-events:none}
    .brand{position:absolute;left:18px;top:58px;padding:10px 14px;border:1px solid #ffffff55;border-radius:14px;background:#163044bb;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0004}
    .brand strong{display:block;font-size:16px;letter-spacing:.08em}
    .brand span{display:block;margin-top:4px;color:#d8edf7;font-size:12px}
    #hearts{position:absolute;left:18px;top:16px;display:flex;gap:8px;filter:drop-shadow(0 2px 4px #0008)}
    .heart{width:28px;height:28px;display:block;transition:transform .15s ease,opacity .2s}
    .heart svg{width:100%;height:100%;display:block}
    .heart--empty{opacity:.28;transform:scale(.92)}
    #modeButton{display:none}
    #crosshair{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%)}
    #crosshair::before,#crosshair::after{content:"";position:absolute;background:#fff;box-shadow:0 1px 2px #000}
    #crosshair::before{left:4px;top:0;width:2px;height:10px}
    #crosshair::after{left:0;top:4px;width:10px;height:2px}
    .help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:#122230c9;color:#eaf8ff;font-size:12px;white-space:nowrap}
    #editorPanel{display:none!important}
    #editorPanel[hidden]{display:none}
    #editorPanel h2{margin:0 0 12px;font-size:16px}
    .field{display:grid;grid-template-columns:88px 1fr 36px;gap:8px;align-items:center;margin:9px 0;font-size:13px}
    .field select,.field input{width:100%}
    select{grid-column:2/4;padding:7px 9px;border:1px solid #ffffff44;border-radius:8px;color:#fff;background:#263e4d}
    input[type=range]{accent-color:#ffd066}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .actions button{padding:9px 7px;border:1px solid #ffffff44;border-radius:9px;color:#fff;background:#2d5368;cursor:pointer}
    .actions button.primary{grid-column:1/-1;background:#ad6b24;border-color:#ffd28b}
    #importFile{display:none}
    #toast{position:absolute;left:50%;top:82px;transform:translate(-50%,-12px);padding:10px 16px;border-radius:10px;background:#10202bdc;color:#fff;opacity:0;transition:.25s;box-shadow:0 8px 28px #0005}
    #toast.show{opacity:1;transform:translate(-50%,0)}
    #deathScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#3a1018ee 0%,#0a0608f2 72%);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:20}
    #deathScreen.show{opacity:1;pointer-events:auto}
    #deathScreen .death-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 36px;border:1px solid #ff8a9a55;border-radius:18px;background:#1a0c10d8;box-shadow:0 18px 50px #000a;backdrop-filter:blur(10px);text-align:center}
    #deathScreen h1{margin:0;font-size:42px;letter-spacing:.18em;color:#ffd0d8;font-weight:700}
    #deathScreen p{margin:0;color:#f0c4cb;font-size:14px}
    #respawnButton{pointer-events:auto;border:1px solid #ffb4c0aa;border-radius:999px;padding:12px 28px;color:#fff;background:#8a2438;cursor:pointer;font-size:16px;letter-spacing:.08em}
    #respawnButton:hover{background:#a52d45}
    @media(max-width:680px){.help{white-space:normal;text-align:center;width:calc(100% - 32px)}#editorPanel{top:68px}.brand{max-width:60vw}#deathScreen h1{font-size:32px}}
  </style>
</head>
<body>
  <canvas id="world" aria-label="Backrooms 沙盒开放世界"></canvas>
  <div class="hud">
    <div id="hearts" aria-label="血量" role="status">
      <span class="heart" data-heart="0" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 21s-7.2-4.35-9.6-8.4C.6 9.3 2.1 5.7 5.4 5.1c1.9-.35 3.7.55 4.6 2.05C10.9 5.65 12.7 4.75 14.6 5.1c3.3.6 4.8 4.2 3 7.5C19.2 16.65 12 21 12 21z"/></svg></span>
      <span class="heart" data-heart="1" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 21s-7.2-4.35-9.6-8.4C.6 9.3 2.1 5.7 5.4 5.1c1.9-.35 3.7.55 4.6 2.05C10.9 5.65 12.7 4.75 14.6 5.1c3.3.6 4.8 4.2 3 7.5C19.2 16.65 12 21 12 21z"/></svg></span>
      <span class="heart" data-heart="2" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 21s-7.2-4.35-9.6-8.4C.6 9.3 2.1 5.7 5.4 5.1c1.9-.35 3.7.55 4.6 2.05C10.9 5.65 12.7 4.75 14.6 5.1c3.3.6 4.8 4.2 3 7.5C19.2 16.65 12 21 12 21z"/></svg></span>
    </div>
    <div class="brand"><strong>BACKROOMS - 沙盒</strong><span id="modeText">游戏模式</span></div>
    <button id="modeButton" type="button">进入编辑器</button>
    <div id="crosshair" aria-hidden="true"></div>
    <div class="help" id="helpText">WASD 移动 · 看向石门按 Q 开门 · 仅出口有斜坡，其余是悬崖</div>
    <div id="deathScreen" hidden aria-live="assertive">
      <div class="death-card">
        <h1>你死了</h1>
        <p>坠落太深，旅程在此中断</p>
        <button id="respawnButton" type="button">重生</button>
      </div>
    </div>
    <section id="editorPanel" hidden>
      <h2>Chunk 地图编辑器</h2>
      <label class="field"><span>工具</span><select id="tool">
        <option value="raise">抬高地形</option><option value="lower">降低地形</option>
        <option value="flatten">平整地形</option><option value="place">放置物体</option>
        <option value="delete">删除物体</option>
      </select></label>
      <label class="field"><span>物体</span><select id="objectKind">
        <option value="tree">树木</option><option value="rock">岩石</option>
        <option value="crate">木箱</option><option value="ruin">遗迹</option>
      </select></label>
      <label class="field"><span>笔刷大小</span><input id="brushSize" type="range" min="2" max="18" step=".5" value="5"><b id="sizeValue">5.0</b></label>
      <label class="field"><span>笔刷强度</span><input id="brushStrength" type="range" min=".2" max="5" step=".2" value="1.4"><b id="strengthValue">1.4</b></label>
      <div class="actions">
        <button id="exportJson" type="button">导出 JSON</button>
        <button id="importJson" type="button">导入 JSON</button>
        <button id="copyCode" class="primary" type="button">复制地图到代码</button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json">
    </section>
    <div id="toast" role="status"></div>
  </div>
  <script>/*__BACKROOMS_SANDBOX_BUNDLE__*/</script>
</body>
</html>
