<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>后室 Level 0 — 极危行动</title>
  <link rel="stylesheet" href="css/backrooms-level0.css?v=23">
  <link rel="stylesheet" href="css/backrooms-survival.css?v=6">
</head>
<body>
  <canvas id="backroomsCanvas" aria-label="后室 Level 0 预览"></canvas>
  <canvas id="backroomsL0Fx" class="backrooms-l0-fx" aria-hidden="true"></canvas>
  <div id="backroomsInput" class="backrooms-input" aria-hidden="true"></div>
  <div class="backrooms-crosshair" id="backroomsCrosshair" aria-hidden="true"></div>

  <div class="backrooms-hud">
    <p class="backrooms-hud__title">Backrooms · Level 0 · 生存难度 1</p>
    <div class="backrooms-nav" aria-label="状态">
      <div class="backrooms-nav__row">
        <p class="backrooms-overheat" id="backroomsOverheat" hidden>过热</p>
        <p class="backrooms-overcold" id="backroomsOvercold" hidden>过冷</p>
        <p class="backrooms-temp" id="backroomsTemp">
          <span class="backrooms-temp__label">温度</span>
          <span class="backrooms-temp__meter" aria-hidden="true"
            ><span class="backrooms-temp__fill" id="backroomsTempFill"></span
          ></span>
          <strong class="backrooms-temp__value" id="backroomsTempValue">—</strong>
        </p>
        <p class="backrooms-points">
          <span class="backrooms-points__label">积分点</span>
          <strong class="backrooms-points__value" id="backroomsMegPoints">0</strong>
        </p>
      </div>
    </div>
    <p class="backrooms-hud__hint" id="backroomsHint">
      加载中…
    </p>
    <p class="backrooms-hud__clip" id="backroomsClipHint" hidden>按 <kbd>Q</kbd> 切出</p>
    <div class="backrooms-hud__error" id="backroomsError" hidden></div>
  </div>

  <form class="backrooms-dev-jump" id="backroomsDevJump" hidden>
    <label for="backroomsDevJumpInput">测试指令</label>
    <input id="backroomsDevJumpInput" type="text" autocomplete="off" spellcheck="false" maxlength="16">
    <div>
      <button type="submit">确认</button>
      <button type="button" data-dev-jump-cancel>取消</button>
    </div>
  </form>

  <script>
    // 模块图解析失败时 init() 根本不会执行，页面会永远停在"加载中…"且没有任何提示。
    (function () {
      var shown = false;
      function surface(message) {
        if (shown) return;
        var box = document.getElementById("backroomsError");
        if (!box) return;
        shown = true;
        box.textContent = "加载失败：" + message;
        box.hidden = false;
      }
      window.addEventListener("error", function (ev) {
        if (ev && ev.message) surface(ev.message);
      });
      window.addEventListener("unhandledrejection", function (ev) {
        surface(String((ev && ev.reason) || "未知错误"));
      });
      window.setTimeout(function () {
        var hint = document.getElementById("backroomsHint");
        if (hint && hint.textContent.indexOf("加载中") >= 0) {
          surface("初始化超时，请强制刷新（Cmd+Shift+R）后重试");
        }
      }, 12000);
    })();
  </script>

  <script src="js/backrooms-client-pack.js?v=5"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="js/backrooms-level0.js?v=85"></script>
</body>
</html>
